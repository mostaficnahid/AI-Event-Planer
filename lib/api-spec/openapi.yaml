openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: AI Events Organizer API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: events
    description: Event management
  - name: guests
    description: Guest management
  - name: categories
    description: Event categories
  - name: ai
    description: AI-powered features

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenBody"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  # ─── USERS ───────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  # ─── EVENTS ──────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all events
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [events]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /events/analytics:
    get:
      operationId: getAnalytics
      tags: [events]
      summary: Get analytics chart data
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"

  /events/upcoming:
    get:
      operationId: getUpcomingEvents
      tags: [events]
      summary: Get upcoming events
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [events]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Event deleted
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{id}/rsvp:
    post:
      operationId: rsvpToEvent
      tags: [events]
      summary: RSVP to an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: RSVP confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── GUESTS ──────────────────────────────────────────────
  /events/{eventId}/guests:
    get:
      operationId: listGuests
      tags: [guests]
      summary: List guests for an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Guest list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"

    post:
      operationId: addGuest
      tags: [guests]
      summary: Add a guest to an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGuestBody"
      responses:
        "201":
          description: Guest added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"

  /events/{eventId}/guests/{guestId}:
    patch:
      operationId: updateGuest
      tags: [guests]
      summary: Update guest RSVP status
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: guestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGuestBody"
      responses:
        "200":
          description: Guest updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"

    delete:
      operationId: removeGuest
      tags: [guests]
      summary: Remove a guest from an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: guestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Guest removed

  # ─── CATEGORIES ──────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  # ─── AI ──────────────────────────────────────────────────
  /ai/generate-description:
    post:
      operationId: generateEventDescription
      tags: [ai]
      summary: AI-generate an event description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDescriptionBody"
      responses:
        "200":
          description: Generated description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDescription"

  /ai/suggest-schedule:
    post:
      operationId: suggestEventSchedule
      tags: [ai]
      summary: AI-suggest optimal event schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestScheduleBody"
      responses:
        "200":
          description: Scheduling suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSuggestion"

  /ai/estimate-budget:
    post:
      operationId: estimateBudget
      tags: [ai]
      summary: AI-estimate event budget breakdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateBudgetBody"
      responses:
        "200":
          description: Budget estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetEstimate"

  /ai/suggest-themes:
    post:
      operationId: suggestThemes
      tags: [ai]
      summary: AI-suggest event themes and improvements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestThemesBody"
      responses:
        "200":
          description: Theme suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeSuggestions"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: AI event planning chat assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatBody"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ─── AUTH ──────────────────────────────────
    RegisterBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [admin, organizer, attendee]
      required:
        - name
        - email
        - password

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    RefreshTokenBody:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - refreshToken
        - user

    # ─── USERS ────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, organizer, attendee]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - createdAt

    UpdateMeBody:
      type: object
      properties:
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]

    # ─── EVENTS ───────────────────────────────
    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, published, cancelled, completed]
        attendeeCount:
          type: integer
        maxAttendees:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        budget:
          type: ["number", "null"]
        budgetUsed:
          type: ["number", "null"]
        tags:
          type: array
          items:
            type: string
        organizerId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - category
        - location
        - startDate
        - endDate
        - status
        - attendeeCount
        - tags
        - createdAt
        - updatedAt

    CreateEventBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, published, cancelled, completed]
        maxAttendees:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        budget:
          type: ["number", "null"]
        budgetUsed:
          type: ["number", "null"]
        tags:
          type: array
          items:
            type: string
      required:
        - title
        - description
        - category
        - location
        - startDate
        - endDate
        - status

    UpdateEventBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, published, cancelled, completed]
        maxAttendees:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        budget:
          type: ["number", "null"]
        budgetUsed:
          type: ["number", "null"]
        tags:
          type: array
          items:
            type: string

    # ─── GUESTS ───────────────────────────────
    Guest:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        email:
          type: string
        rsvpStatus:
          type: string
          enum: [pending, confirmed, declined, maybe]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventId
        - name
        - email
        - rsvpStatus
        - createdAt

    AddGuestBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        note:
          type: ["string", "null"]
      required:
        - name
        - email

    UpdateGuestBody:
      type: object
      properties:
        rsvpStatus:
          type: string
          enum: [pending, confirmed, declined, maybe]
        note:
          type: ["string", "null"]

    # ─── CATEGORIES ───────────────────────────
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        icon:
          type: string
        eventCount:
          type: integer
      required:
        - id
        - name
        - color
        - icon
        - eventCount

    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: string
      required:
        - name
        - color
        - icon

    # ─── DASHBOARD ────────────────────────────
    DashboardSummary:
      type: object
      properties:
        totalEvents:
          type: integer
        upcomingEvents:
          type: integer
        totalAttendees:
          type: integer
        publishedEvents:
          type: integer
        completedEvents:
          type: integer
        cancelledEvents:
          type: integer
        draftEvents:
          type: integer
        totalBudget:
          type: number
        totalBudgetUsed:
          type: number
        eventsByCategory:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: integer
            required:
              - category
              - count
      required:
        - totalEvents
        - upcomingEvents
        - totalAttendees
        - publishedEvents
        - completedEvents
        - cancelledEvents
        - draftEvents
        - totalBudget
        - totalBudgetUsed
        - eventsByCategory

    AnalyticsData:
      type: object
      properties:
        attendanceByMonth:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              attendees:
                type: integer
              events:
                type: integer
            required:
              - month
              - attendees
              - events
        statusBreakdown:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
              fill:
                type: string
            required:
              - status
              - count
              - fill
        budgetVsActual:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              budget:
                type: number
              actual:
                type: number
            required:
              - name
              - budget
              - actual
        categoryDistribution:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: integer
              attendees:
                type: integer
            required:
              - category
              - count
              - attendees
      required:
        - attendanceByMonth
        - statusBreakdown
        - budgetVsActual
        - categoryDistribution

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [created, updated, cancelled, completed, rsvp, guest_added]
        eventId:
          type: integer
        eventTitle:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - type
        - eventId
        - eventTitle
        - description
        - timestamp

    # ─── AI ───────────────────────────────────
    GenerateDescriptionBody:
      type: object
      properties:
        title:
          type: string
        category:
          type: string
        location:
          type: string
        additionalContext:
          type: ["string", "null"]
      required:
        - title
        - category
        - location

    GeneratedDescription:
      type: object
      properties:
        description:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - description
        - tags

    SuggestScheduleBody:
      type: object
      properties:
        title:
          type: string
        category:
          type: string
        durationHours:
          type: number
        preferredDayOfWeek:
          type: ["string", "null"]
      required:
        - title
        - category
        - durationHours

    ScheduleSuggestion:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: object
            properties:
              startDate:
                type: string
                format: date-time
              endDate:
                type: string
                format: date-time
              reasoning:
                type: string
            required:
              - startDate
              - endDate
              - reasoning
      required:
        - suggestions

    EstimateBudgetBody:
      type: object
      properties:
        title:
          type: string
        category:
          type: string
        location:
          type: string
        attendeeCount:
          type: integer
        durationHours:
          type: number
      required:
        - title
        - category
        - location
        - attendeeCount
        - durationHours

    BudgetEstimate:
      type: object
      properties:
        totalEstimate:
          type: number
        breakdown:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              amount:
                type: number
              percentage:
                type: number
              notes:
                type: string
            required:
              - category
              - amount
              - percentage
              - notes
        currency:
          type: string
        confidence:
          type: string
      required:
        - totalEstimate
        - breakdown
        - currency
        - confidence

    SuggestThemesBody:
      type: object
      properties:
        title:
          type: string
        category:
          type: string
        description:
          type: string
      required:
        - title
        - category
        - description

    ThemeSuggestions:
      type: object
      properties:
        themes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              improvements:
                type: array
                items:
                  type: string
              engagementTips:
                type: array
                items:
                  type: string
            required:
              - name
              - description
              - improvements
              - engagementTips
      required:
        - themes

    AiChatBody:
      type: object
      properties:
        message:
          type: string
        eventContext:
          type: ["string", "null"]
        history:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
            required:
              - role
              - content
      required:
        - message

    AiChatResponse:
      type: object
      properties:
        reply:
          type: string
        suggestions:
          type: array
          items:
            type: string
      required:
        - reply
        - suggestions
